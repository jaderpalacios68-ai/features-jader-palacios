<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JP STYLE</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#f4f4f4;}

/* HEADER */
.top-bar{
  background:#d60000;
  color:white;
  padding:10px 50px;
  display:flex;
  justify-content:space-between;
}
header{
  background:#111;
  color:white;
  padding:20px 50px;
}
.logo{
  font-size:32px;
  font-weight:bold;
}
.logo span{color:red;}

/* PRODUCTOS */
.productos{
  padding:70px 50px;
  background:white;
}
.titulo{
  text-align:center;
  font-size:40px;
  margin-bottom:50px;
}
.titulo span{color:red;}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
}
.card{
  background:white;
  box-shadow:0 8px 20px rgba(0,0,0,.1);
  border-radius:10px;
  overflow:hidden;
  transition:.3s;
}
.card:hover{transform:translateY(-8px);}
.card img{
  width:100%;
  height:280px;
  object-fit:cover;
}
.info{padding:20px;}
.precio{
  color:red;
  font-size:22px;
  font-weight:bold;
  margin:10px 0;
}

/* SECCIÓN FORMULARIOS */
.seccion-formularios{
  padding:80px 50px;
  background:#f9f9f9;
}

.form-container{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
  max-width:1100px;
  margin:auto;
}

.form-box{
  background:white;
  padding:30px;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
}

.form-box h2{
  text-align:center;
  margin-bottom:25px;
}

form{
  display:flex;
  flex-direction:column;
  gap:15px;
}

input, select{
  padding:12px;
  border:1px solid #ccc;
  border-radius:6px;
}

button{
  padding:12px;
  background:red;
  color:white;
  border:none;
  font-weight:bold;
  cursor:pointer;
  border-radius:6px;
  transition:.3s;
}
button:hover{background:black;}

.mensaje{
  margin-top:15px;
  text-align:center;
  font-weight:bold;
}

/* RESPONSIVE */
@media(max-width:900px){
  .form-container{
    grid-template-columns:1fr;
  }
}

footer{
  background:#111;
  color:white;
  text-align:center;
  padding:25px;
}
</style>
</head>

<body>

<div class="top-bar">
  <p>Nueva colección deportiva disponible</p>
  <p>JPSTYLE@email.com | +57 300 000 0000</p>
</div>

<header>
  <div class="logo">JP <span>STYLE</span></div>
</header>

<!-- PRODUCTOS -->
<section class="productos">
  <h1 class="titulo">PRODUCTOS <span>DESTACADOS</span></h1>
  <div class="grid" id="grid">
    <p>Cargando productos...</p>
  </div>
</section>

<!-- FORMULARIOS EN COLUMNAS -->
<section class="seccion-formularios">

  <div class="form-container">

    <!-- PEDIDO -->
    <div class="form-box">
      <h2>REALIZAR PEDIDO</h2>

      <form id="formPedido">
        <input type="text" id="cliente" placeholder="Nombre del cliente" required>
        <input type="text" id="producto" placeholder="Producto" required>
        <input type="number" id="cantidad" placeholder="Cantidad" required>
        <input type="number" id="precio" placeholder="Precio" required>
        <button type="submit">Crear Pedido</button>
      </form>

      <p id="mensajePedido" class="mensaje"></p>
    </div>

    <!-- PAGO -->
    <div class="form-box">
      <h2>REALIZAR PAGO</h2>

      <form id="formPSE">
        <input type="text" id="nombrePSE" placeholder="Nombre del titular" required>
        <input type="text" id="bancoPSE" placeholder="Banco" required>
        <input type="number" id="montoPSE" placeholder="Monto a pagar" required>

        <select id="tipoCuenta" required>
          <option value="">Tipo de cuenta</option>
          <option value="Ahorros">Ahorros</option>
          <option value="Corriente">Corriente</option>
        </select>

        <button type="submit">Pagar</button>
      </form>

      <p id="mensajePSE" class="mensaje"></p>
    </div>

  </div>

</section>

<footer>&copy; 2026 JP STYLE - Todos los derechos reservados</footer>

<script>

// CARGAR PRODUCTOS
async function cargarProductos(){
  try{
    const res = await fetch('/api/productos');
    const productos = await res.json();

    document.getElementById('grid').innerHTML = productos.map(p => `
      <div class="card">
        <img src="${p.imagen}" alt="${p.nombre}">
        <div class="info">
          <h3>${p.nombre}</h3>
          <div class="precio">$${p.precio}</div>
          <p>${p.descripcion}</p>
        </div>
      </div>
    `).join('');

  }catch{
    document.getElementById('grid').innerHTML =
      '<p style="color:red;">Error cargando productos</p>';
  }
}

cargarProductos();


// CREAR PEDIDO
formPedido.addEventListener('submit', async e=>{
  e.preventDefault();

  const pedido = {
    cliente: cliente.value,
    producto: producto.value,
    cantidad: Number(cantidad.value),
    precio: Number(precio.value)
  };

  await fetch('/api/pedidos',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(pedido)
  });

  mensajePedido.innerText="✅ Pedido creado correctamente";
  formPedido.reset();
});


// REALIZAR PAGO
formPSE.addEventListener('submit', async e=>{
  e.preventDefault();

  const pago = {
    nombre:nombrePSE.value,
    banco:bancoPSE.value,
    monto:Number(montoPSE.value),
    tipoCuenta:tipoCuenta.value
  };

  await fetch('/api/pagos',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(pago)
  });

  mensajePSE.innerText="✅ Pago realizado correctamente";
  formPSE.reset();
});

</script>

</body>
</html>
