<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JP STYLE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#f5f5f5;}
.top-bar{background:#d60000;color:white;padding:10px 50px;display:flex;justify-content:space-between;font-size:14px;}
header{background:#111;color:white;padding:20px 50px;display:flex;justify-content:space-between;align-items:center;}
.logo{font-size:35px;font-weight:bold;color:white;}
.logo span{color:red;}
nav a{color:white;text-decoration:none;margin:0 20px;font-weight:bold;transition:.3s;}
nav a:hover{color:red;}
.hero{height:90vh;background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,.6)),url('/img/conjunto.jpg') center/cover;display:flex;align-items:center;padding:100px;}
.hero-text h3{color:#666;margin-bottom:10px;}
.hero-text h1{font-size:85px;font-weight:900;line-height:1;color:#111;}
.hero-text span{color:red;}
.btn{display:inline-block;margin-top:30px;padding:18px 35px;background:red;color:white;text-decoration:none;font-weight:bold;transition:.3s;}
.btn:hover{background:black;}
.productos{padding:80px 50px;background:white;}
.titulo{text-align:center;font-size:45px;margin-bottom:50px;color:#111;}
.titulo span{color:red;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:30px;}
.card{background:white;box-shadow:0 10px 25px rgba(0,0,0,.1);overflow:hidden;transition:.3s;}
.card:hover{transform:translateY(-10px);}
.card img{width:100%;height:350px;object-fit:cover;}
.info{padding:20px;}
.info h2{font-size:22px;margin-bottom:10px;}
.precio{color:red;font-size:24px;font-weight:bold;margin-bottom:15px;}
.info p{color:#666;margin-bottom:20px;}
.comprar{background:#111;color:white;padding:12px 25px;border:none;cursor:pointer;font-size:14px;font-weight:bold;}
.comprar:hover{background:red;}
.loading{text-align:center;padding:50px;font-size:18px;color:#666;}
footer{background:#111;color:white;text-align:center;padding:30px;}
@media(max-width:768px){
  .top-bar{flex-direction:column;gap:5px;text-align:center;padding:10px 20px;}
  header{flex-direction:column;gap:15px;padding:20px;}
  .hero{padding:40px 20px;height:auto;min-height:60vh;}
  .hero-text h1{font-size:45px;}
  .productos{padding:40px 20px;}
  .titulo{font-size:30px;}
}
</style>
</head>
<body>
<div class="top-bar">
  <p>Nueva coleccion deportiva disponible</p>
  <p>JPSTYLE@email.com | +57 300 000 0000</p>
</div>
<header>
  <div class="logo">JP <span>STYLE</span></div>
  <nav>
    <a href="#">Inicio</a>
    <a href="#">Coleccion</a>
    <a href="#">Ofertas</a>
    <a href="#">Contacto</a>
  </nav>
</header>
<section class="hero">
  <div class="hero-text">
    <h3>ASPIRE TO MORE</h3>
    <h1>NUEVAS <span>COLECCIONES</span><br>DEPORTIVAS</h1>
    <a href="#productos" class="btn">Comprar Ahora</a>
  </div>
</section>
<section class="productos" id="productos">
  <h1 class="titulo">PRODUCTOS <span>DESTACADOS</span></h1>
  <div class="grid" id="grid">
    <div class="loading">Cargando productos...</div>
  </div>
</section>
<footer>&copy; 2026 JP STYLE - Todos los derechos reservados</footer>
<script>
async function cargarProductos(){
  try{
    const res = await fetch('/api/productos');
    const productos = await res.json();
    document.getElementById('grid').innerHTML = productos.map(p => `
      <div class="card">
        <img src="${p.imagen}" alt="${p.nombre}">
        <div class="info">
          <h2>${p.nombre}</h2>
          <div class="precio">$${p.precio.toLocaleString('es-CO')}</div>
          <p>${p.descripcion}</p>
          <button class="comprar">Comprar</button>
        </div>
      </div>`).join('');
  }catch(e){
    document.getElementById('grid').innerHTML='<p style="text-align:center;color:red;">Error cargando productos</p>';
  }
}
cargarProductos();
</script>
</body>
</html>
